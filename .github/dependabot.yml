# ─────────────────────────────────────────────────────────────────────────────
# Dependabot — Automated dependency updates
# ─────────────────────────────────────────────────────────────────────────────
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "eslint"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    assignees:
      - "Anton-Mosquito"
